[project]
name = "curriculum-navigator-api"
version = "0.1.0"
description = "Modular Django backend for explainable curriculum intelligence."
requires-python = ">=3.14,<3.15"
dependencies = [
  "Django==6.0.8",
  "django-ninja==1.6.2",
  "pydantic==2.13.4",
  "psycopg[binary]==3.3.4",
  "hypothesis==6.165.9",
  "ortools==9.15.6755",
  "opentelemetry-sdk==1.44.0",
  "opentelemetry-exporter-otlp-proto-http==1.44.0",
  "structlog==25.5.0",
  "gunicorn==23.0.0",
  "pypdf==6.16.1",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-django==4.14.0",
  "ruff==0.16.3",
  "mypy==2.3.1",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "-ra"
testpaths = ["tests", "modules"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["migrations"]

[[tool.mypy.overrides]]
module = ["config.*", "modules.*", "tests.*"]
disallow_subclassing_any = false
warn_return_any = false
