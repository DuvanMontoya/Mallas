name: release-images

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable application release tag, for example 0.1.0
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish API by immutable digest
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/curriculum-navigator-api:${{ inputs.release_tag }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          provenance: true
          sbom: true
      - name: Publish web by immutable digest
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: infra/docker/web.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/curriculum-navigator-web:${{ inputs.release_tag }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          provenance: true
          sbom: true
      - name: Release handoff
        run: |
          echo "Record the two registry digests in the release manifest and production.env before deployment."
          echo "The production Compose file rejects missing API_IMAGE/WEB_IMAGE and never deploys a mutable tag by itself."
