name: verify
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.21.0
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
        with:
          version: 0.11.19
      - run: pnpm install --frozen-lockfile
      - run: uv sync --project apps/api --frozen
      - run: uv run --project apps/api python apps/api/manage.py migrate --check
      - run: uv run --project apps/api python apps/api/manage.py makemigrations --check --dry-run
      - run: python scripts/verify.py
      - name: Check OpenAPI breaking changes against pull request base
        if: github.event_name == 'pull_request'
        run: python scripts/check_openapi_breaking.py --base-revision "${{ github.event.pull_request.base.sha }}"
      - run: pnpm --dir apps/web build
