name: verify
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify-control-repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python scripts/verify.py
# P00 expands this workflow with backend/frontend matrices after lockfiles exist.
