name: source-freshness

on:
  schedule:
    - cron: "37 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    name: official-normative-source-watch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Check allowlisted sources
        run: |
          python scripts/source_freshness.py \
            --config docs/research/source_watch.json \
            --output source-freshness.json \
            --fail-on-stale \
            --fail-on-unknown
      - name: Upload freshness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-freshness-${{ github.run_id }}
          path: source-freshness.json
          if-no-files-found: error
