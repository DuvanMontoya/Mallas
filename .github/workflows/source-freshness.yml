name: source-freshness

on:
  schedule:
    - cron: "37 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    name: official-normative-source-watch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: Check allowlisted sources
        run: |
          python scripts/source_freshness.py \
            --config docs/research/source_watch.json \
            --output source-freshness.json \
            --fail-on-stale \
            --fail-on-unknown
      - name: Upload freshness report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-freshness-${{ github.run_id }}
          path: source-freshness.json
          if-no-files-found: error
