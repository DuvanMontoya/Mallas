name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.21.0
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
        with:
          version: 0.11.19
      - run: pnpm install --frozen-lockfile
      - run: uv sync --project apps/api --frozen
      - name: Secret scan
        run: python scripts/scan_secrets.py
      - name: High-confidence SAST
        run: python scripts/sast.py
      - name: Python dependency audit
        shell: bash
        run: |
          uv export --project apps/api --frozen --no-dev --format requirements.txt --output-file /tmp/curriculum-requirements.txt
          uvx --from pip-audit==2.9.0 pip-audit -r /tmp/curriculum-requirements.txt --strict
      - name: Frontend dependency audit
        run: pnpm audit --prod --audit-level high
      - name: Production Django security checks
        env:
          DJANGO_DEBUG: "false"
          DJANGO_SECRET_KEY: ci-only-secret-not-used-for-production-12345678901234567890
          ALLOWED_HOSTS: localhost
          CORS_ALLOWED_ORIGINS: https://app.example.edu
          CSRF_TRUSTED_ORIGINS: https://app.example.edu
        run: uv run --project apps/api --frozen python apps/api/manage.py check --deploy
