name: periodic-audits

on:
  schedule:
    - cron: "47 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "24.19.0"
  PNPM_VERSION: "11.21.0"

jobs:
  accessibility-security:
    name: monthly-accessibility-security-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web test
      - run: pnpm --dir apps/web lint
      - run: pnpm --dir apps/web typecheck
      - run: pnpm --dir apps/web audit:bundle
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --dir apps/web e2e
      - run: python scripts/scan_secrets.py
      - run: python scripts/sast.py
      - run: python scripts/verify_docs_clone_clean.py
      - run: python scripts/verify_state_recovery.py
