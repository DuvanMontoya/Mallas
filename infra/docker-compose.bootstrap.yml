services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-curriculum}
      POSTGRES_USER: ${POSTGRES_USER:-curriculum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-curriculum_local_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-curriculum} -d ${POSTGRES_DB:-curriculum}"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
